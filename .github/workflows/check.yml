name: check

on:
  push: { branches: [main] }
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # The skills reference each other by path. A broken reference fails
      # silently at runtime as "the agent couldn't find the file", so it is
      # checked here instead.
      - name: repo invariants
        run: bun scripts/check.ts

      # Both scripts must run clean against a repo with nothing to find.
      - name: scanners execute
        run: |
          bun skills/secure/scripts/scan.ts . > /dev/null
          bun skills/secure/scripts/scan.ts . | grep -q "skipped .* vendored folders"
          bun skills/secure/scripts/scan.ts . --vendored --json | node -e "JSON.parse(require('fs').readFileSync(0)).vendored.length === 0 || process.exit(1)"
          bun skills/ship/scripts/readiness.ts . > /dev/null

      # The guide's scripts must run on a machine with no skills installed and
      # no journey yet — that is every new user's first run.
      - name: guide scripts execute
        env: { CLAUDE_CONFIG_DIR: /tmp/empty-claude, RAFFY_HOME: /tmp/raffy-home }
        run: |
          bun skills/guide/scripts/inventory.ts . --json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun skills/guide/scripts/journey.ts where . --json > /dev/null
          bun skills/guide/scripts/journey.ts log /tmp --skill raffy:guide --phase build --status done --note ci
          bun skills/guide/scripts/journey.ts all | grep -q raffy:guide
          bun skills/guide/scripts/catalog.ts find did I leak api keys | grep -q raffy:secure

      # The guard decides which commands an agent may run without asking; the
      # proof check decides whether "tests pass" may end a turn. Both have
      # cases that must be caught and cases that must pass.
      - name: guard and proof rules
        run: |
          bun test hooks/guard.test.ts hooks/proof.test.ts
          printf '{"tool_input":{"command":"git push --force"}}' | bun hooks/guard.ts | grep -q '"permissionDecision":"ask"'
          test -z "$(printf '{"tool_input":{"command":"bun test"}}' | bun hooks/guard.ts)"

      # The prompt hook runs before every message a user sends. It must answer
      # fast, say nothing on unrelated prompts, and never fail.
      - name: prompt hook
        env: { RAFFY_HOME: /tmp/raffy-hook }
        run: |
          out=$(printf '{"prompt":"did I leak any api keys in here","session_id":"ci"}' | bun hooks/prompt.ts)
          echo "$out" | grep -q raffy:secure
          quiet=$(printf '{"prompt":"rename this variable to count","session_id":"ci2"}' | bun hooks/prompt.ts | grep -v "not set up" || true)
          test -z "$quiet"
          printf 'not json' | bun hooks/prompt.ts

      # Spaced repetition: a miss is due tomorrow, and the session brief says so.
      - name: drill schedule
        env: { RAFFY_HOME: /tmp/raffy-drill }
        run: |
          bun skills/drill/scripts/ledger.ts record webhook-idempotency miss | grep -q "review"
          test "$(bun skills/drill/scripts/ledger.ts due --count)" = "0"
          mkdir -p /tmp/drillproj/.raffy && printf '{"cwd":"/tmp/drillproj"}' | bun hooks/session.ts > /dev/null

      # Copies for other agents: every ${CLAUDE_PLUGIN_ROOT} resolved, names
      # prefixed, a foreign folder never overwritten, uninstall exact.
      - name: other agents
        run: |
          d=$(mktemp -d)
          bun scripts/agents.ts install --dir "$d"
          ! grep -l 'CLAUDE_PLUGIN_ROOT' "$d"/raffy-*/SKILL.md
          grep -q '^name: raffy-guide' "$d/raffy-guide/SKILL.md"
          mkdir "$d/raffy-x-mine" && bun scripts/agents.ts uninstall --dir "$d" && test -d "$d/raffy-x-mine"

      # The doctor must run on a machine with nothing installed.
      - name: doctor
        env: { CLAUDE_CONFIG_DIR: /tmp/empty-claude }
        run: |
          bun skills/doctor/scripts/doctor.ts budget . | grep -q "tokens load before your first prompt"
          bun skills/doctor/scripts/doctor.ts skills . --json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun skills/doctor/scripts/doctor.ts fire "write tests first" | grep -q "estimate"

      # The dashboard reads everything and writes nothing; it must work on a
      # machine with no sessions and no raffy history.
      - name: dashboard
        env: { RAFFY_HOME: /tmp/raffy-dash, CLAUDE_CONFIG_DIR: /tmp/empty-claude }
        run: |
          bun tui/dash.ts --once | grep -q "0 projects"
          bun tui/dash.ts --json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun tui/sessions.ts --json | node -e "JSON.parse(require('fs').readFileSync(0)).sessions.length === 0 || process.exit(1)"
          bun skills/guide/scripts/catalog.ts list --json | node -e "JSON.parse(require('fs').readFileSync(0)).length > 0 || process.exit(1)"
          bun skills/drill/scripts/ledger.ts json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun skills/doctor/scripts/doctor.ts budget . --json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun tui/web.ts --port 4790 & sleep 2
          curl -sf localhost:4790/api/projects | node -e "JSON.parse(require('fs').readFileSync(0))"
          curl -sf localhost:4790/ | grep -q "<title>raffy</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rebound.example:4790' localhost:4790/api/sessions)" = "403"

      # Memory round-trip, and the session brief that reads it back.
      - name: memory and session brief
        env: { RAFFY_HOME: /tmp/raffy-mem }
        run: |
          mkdir -p /tmp/proj
          bun skills/guide/scripts/memory.ts remember /tmp/proj --kind decision --text "auth is magic-link only" --why "no password resets" --tags login,auth
          bun skills/guide/scripts/memory.ts recall /tmp/proj login | grep -q magic-link
          printf '{"cwd":"/tmp/proj"}' | bun hooks/session.ts | grep -q "magic-link"
          bun skills/guide/scripts/journey.ts log /tmp/proj --skill x --phase build --status started --why w --not n
          bun skills/guide/scripts/journey.ts log /tmp/proj --skill x --phase build --status progress --note "done: a; next: b"
          printf '{"cwd":"/tmp/proj","source":"compact"}' | bun hooks/session.ts | grep -q "context was compacted"
          printf '{"cwd":"/tmp/proj","source":"compact"}' | bun hooks/session.ts | grep -q "next: b"
          empty=$(mktemp -d) && test -z "$(printf '{"cwd":"%s"}' "$empty" | bun hooks/session.ts)"

      # The knowledge base must index without loss.
      - name: knowledge base builds
        env: { RAFFY_KB_DIR: /tmp/kb }
        run: |
          bun skills/scaffold/scripts/kb.ts build
          bun skills/scaffold/scripts/kb.ts search "does prisma work under bun" -n 1 | grep -q Prisma

      # A bundled skill must match the hash it was bundled with: no silent hand edits.
      - name: bundled library unchanged
        run: bun scripts/vendor.ts check | tee /tmp/lib.txt && ! grep -q "edited by hand" /tmp/lib.txt

      - name: manifests valid
        run: |
          bunx --bun json -h > /dev/null 2>&1 || true
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"

      # parse_findings.py is the contract between qa-audit and any tracker.
      - name: findings parser imports
        run: python3 -c "import ast,sys; ast.parse(open('skills/qa-audit/scripts/parse_findings.py').read())"

  # The desktop app must build, find bun and read the dashboard on all three
  # desktop platforms. --dump exits before any window opens, so it runs headless.
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-22.04, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/raffy-desktop/src-tauri }
      - name: linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: build
        working-directory: native/raffy-desktop/src-tauri
        run: cargo build --release
      # Quoting and allowlists: the only things between the page and a shell.
      - name: unit tests
        working-directory: native/raffy-desktop/src-tauri
        run: cargo test --release
      - name: reads the dashboard
        shell: bash
        env: { RAFFY_ROOT: "${{ github.workspace }}", RAFFY_HOME: "${{ runner.temp }}/raffy", CLAUDE_CONFIG_DIR: "${{ runner.temp }}/claude" }
        # Capture first: `| grep -q` closes the pipe at the first match and the app's
        # later lines would die on a broken pipe.
        run: |
          out=$(native/raffy-desktop/src-tauri/target/release/raffy-desktop --dump)
          echo "$out"
          for want in "0 projects" "sessions: ok" "skills: ok" "drill: ok" "budget: ok"; do
            grep -q "$want" <<< "$out" || { echo "missing: $want"; exit 1; }
          done
