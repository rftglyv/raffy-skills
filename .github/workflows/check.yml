name: check

on:
  push: { branches: [main] }
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # The skills reference each other by path. A broken reference fails
      # silently at runtime as "the agent couldn't find the file", so it is
      # checked here instead.
      - name: repo invariants
        run: bun scripts/check.ts

      # Both scripts must run clean against a repo with nothing to find.
      - name: scanners execute
        run: |
          bun skills/secure/scripts/scan.ts . > /dev/null
          bun skills/ship/scripts/readiness.ts . > /dev/null

      # The guide's scripts must run on a machine with no skills installed and
      # no journey yet — that is every new user's first run.
      - name: guide scripts execute
        env: { CLAUDE_CONFIG_DIR: /tmp/empty-claude, RAFFY_HOME: /tmp/raffy-home }
        run: |
          bun skills/guide/scripts/inventory.ts . --json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun skills/guide/scripts/journey.ts where . --json > /dev/null
          bun skills/guide/scripts/journey.ts log /tmp --skill raffy:guide --phase build --status done --note ci
          bun skills/guide/scripts/journey.ts all | grep -q raffy:guide
          bun skills/guide/scripts/catalog.ts find did I leak api keys | grep -q raffy:secure

      # The prompt hook runs before every message a user sends. It must answer
      # fast, say nothing on unrelated prompts, and never fail.
      - name: prompt hook
        env: { RAFFY_HOME: /tmp/raffy-hook }
        run: |
          out=$(printf '{"prompt":"did I leak any api keys in here","session_id":"ci"}' | bun hooks/prompt.ts)
          echo "$out" | grep -q raffy:secure
          quiet=$(printf '{"prompt":"rename this variable to count","session_id":"ci2"}' | bun hooks/prompt.ts | grep -v "not set up" || true)
          test -z "$quiet"
          printf 'not json' | bun hooks/prompt.ts

      # The dashboard reads everything and writes nothing; it must work on a
      # machine with no sessions and no raffy history.
      - name: dashboard
        env: { RAFFY_HOME: /tmp/raffy-dash, CLAUDE_CONFIG_DIR: /tmp/empty-claude }
        run: |
          bun tui/dash.ts --once | grep -q "0 projects"
          bun tui/dash.ts --json | node -e "JSON.parse(require('fs').readFileSync(0))"
          bun tui/web.ts --port 4790 & sleep 2
          curl -sf localhost:4790/api/projects | node -e "JSON.parse(require('fs').readFileSync(0))"
          curl -sf localhost:4790/ | grep -q "<title>raffy</title>"

      # Memory round-trip, and the session brief that reads it back.
      - name: memory and session brief
        env: { RAFFY_HOME: /tmp/raffy-mem }
        run: |
          mkdir -p /tmp/proj
          bun skills/guide/scripts/memory.ts remember /tmp/proj --kind decision --text "auth is magic-link only" --why "no password resets" --tags login,auth
          bun skills/guide/scripts/memory.ts recall /tmp/proj login | grep -q magic-link
          printf '{"cwd":"/tmp/proj"}' | bun hooks/session.ts | grep -q "magic-link"
          empty=$(mktemp -d) && test -z "$(printf '{"cwd":"%s"}' "$empty" | bun hooks/session.ts)"

      # The knowledge base must index without loss.
      - name: knowledge base builds
        env: { RAFFY_KB_DIR: /tmp/kb }
        run: |
          bun skills/scaffold/scripts/kb.ts build
          bun skills/scaffold/scripts/kb.ts search "does prisma work under bun" -n 1 | grep -q Prisma

      - name: manifests valid
        run: |
          bunx --bun json -h > /dev/null 2>&1 || true
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"

      # parse_findings.py is the contract between qa-audit and any tracker.
      - name: findings parser imports
        run: python3 -c "import ast,sys; ast.parse(open('skills/qa-audit/scripts/parse_findings.py').read())"
